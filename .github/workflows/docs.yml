name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository self-check
        run: python3 scripts/check.py --root .
      - name: Validate the example findings document
        run: |
          SKILL=skills/tg-bot-security-auditor
          if [ -f "$SKILL/assets/findings.example.json" ]; then
            python3 "$SKILL/scripts/validate_findings.py" "$SKILL/assets/findings.example.json" --allow-missing-paths
          else
            echo "no example findings document; skipping"
          fi
